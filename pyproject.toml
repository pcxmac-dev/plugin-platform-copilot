[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-platform-copilot"
version = "0.2.0"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "Copilot for Liminal: GitHub Copilot's models through GitHub's Copilot SDK, evaluating standardized arguments on your own GitHub token, with the plans, models and prices written in."
readme = "README.md"
requires-python = ">=3.11"  # the Copilot SDK's own floor
# the library it plugs into (the AI assistant kind: liminal_libs.assistants, plugin API 2.2); 1.49.0: its cards
dependencies = ["liminal-libs>=1.49.0"]

[project.optional-dependencies]
# GitHub's Copilot SDK: what reaches Copilot (it runs Copilot's runtime; fetch that once with
# `python -m copilot download-runtime`); the plugin loads, sets up and is tested without it
sdk = ["github-copilot-sdk>=1.0.29,<2"]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
copilot = "plugin_platform_copilot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
